# One insert layer. dsh plugin add mounts this file once via dsh.bundle.patch.
# Listing the same package twice in dsh.profile.bundles (package name plus a
# folder alias) concatenates this insert and boot fails: duplicate adp-core.
- insert:
    - id: adp-core
      name: '@tencentcloudadp/dsh-adp'
      config:
        gatewayKeyEnv: ADP_API_KEY
        secretIdEnv: ADP_SECRET_ID
        secretKeyEnv: ADP_SECRET_KEY
        spaceId: default_space
        region: ap-guangzhou
        vendor: ChinaTencentADP
    - id: llm-adp
      name: '@tencentcloudadp/dsh-adp/llm'
      config:
        providers: [adp]
        defaultModel: Hunyuan/hy3
    - id: web-adp
      name: '@tencentcloudadp/dsh-adp/web'
    - id: plugins-adp
      name: '@tencentcloudadp/dsh-adp/plugins'
      config:
        enabledPluginIds: []
        harvestMedia: true
    - id: skills-adp
      name: '@tencentcloudadp/dsh-adp/skills'
    - id: control-adp
      name: '@tencentcloudadp/dsh-adp/control'
      config:
        allowMutating:
          - CreateApp
          - CreateAgent
          - ModifyApp
          - ModifyAgent
          - CreateRelease
          - DeleteAgent
          - DeleteApp
    - id: subagent-adp
      name: '@tencentcloudadp/dsh-adp/subagent'
      config:
        providerName: adp
        appKeyEnv: TENCENT_ADP_APP_KEY
    - id: tool-subagent-adp
      name: '@tencentcloudadp/dsh-adp/subagent/tool'
      config:
        provider: adp
        toolName: subagent_adp
        agentName: 旅游助手
        agentDescription: 旅游相关的问题，天气，出行规划，景点信息，门票信息等。
        backgroundMode: one-shot
        enableRunInBackground: true
        maxDepth: provider-managed
